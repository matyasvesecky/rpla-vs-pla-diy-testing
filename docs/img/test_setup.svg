<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="420" rx="12" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="600" fill="#1f2937">Three point bending jig and data flow</text>

  <!-- jig -->
  <g transform="translate(40,70)">
    <!-- frame -->
    <rect x="0" y="0" width="360" height="22" fill="#b98b5e"/>
    <rect x="0" y="0" width="22" height="300" fill="#b98b5e"/>
    <rect x="338" y="0" width="22" height="300" fill="#b98b5e"/>
    <rect x="0" y="278" width="360" height="22" fill="#b98b5e"/>
    <text x="180" y="294" font-size="11" text-anchor="middle" fill="#ffffff">wooden frame 40 × 50 mm</text>
    
    <!-- screw -->
    <rect x="172" y="-14" width="16" height="120" fill="#9ca3af"/>
    <ellipse cx="180" cy="-14" rx="34" ry="7" fill="#6b7280"/>
    <text x="222" y="-10" font-size="12" fill="#374151">M10 screw, ¼ turn per 5 s</text>
    <!-- load cell -->
    <rect x="140" y="106" width="80" height="22" rx="3" fill="#2563eb"/>
    <text x="180" y="121" font-size="11" text-anchor="middle" fill="#ffffff">load cell 20 kg</text>
    <!-- loading nose -->
    <rect x="174" y="128" width="12" height="32" fill="#4b5563"/>
    <circle cx="180" cy="164" r="7" fill="#4b5563"/>
    <!-- specimen -->
    <rect x="70" y="172" width="220" height="10" fill="#f59e0b"/>
    <text x="180" y="212" font-size="11" text-anchor="middle" fill="#92400e">bar 120 × 15 × 4 mm</text>
    <!-- supports -->
    <circle cx="110" cy="189" r="7" fill="#4b5563"/>
    <circle cx="250" cy="189" r="7" fill="#4b5563"/>
    <rect x="103" y="189" width="14" height="89" fill="#6b7280"/>
    <rect x="243" y="189" width="14" height="89" fill="#6b7280"/>
    <!-- span -->
    <line x1="110" y1="232" x2="250" y2="232" stroke="#111827" stroke-width="1.2"/>
    <line x1="110" y1="226" x2="110" y2="238" stroke="#111827" stroke-width="1.2"/>
    <line x1="250" y1="226" x2="250" y2="238" stroke="#111827" stroke-width="1.2"/>
    <text x="180" y="254" font-size="11" text-anchor="middle" fill="#111827">L = 100 mm</text>
    <!-- force arrow -->
    <text x="196" y="150" font-size="14" font-weight="600" fill="#dc2626">F</text>
  </g>

  <!-- pipeline -->
  <g font-size="13">
    <rect x="470" y="80" width="190" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="565" y="104" text-anchor="middle" fill="#1e3a8a" font-weight="600">HX711 amplifier</text>
    <text x="565" y="123" text-anchor="middle" fill="#1e3a8a">24 bit ADC, about 10 Hz</text>

    <rect x="470" y="168" width="190" height="56" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <text x="565" y="192" text-anchor="middle" fill="#064e3b" font-weight="600">Arduino Nano</text>
    <text x="565" y="211" text-anchor="middle" fill="#064e3b">tare, calibration in EEPROM</text>

    <rect x="470" y="256" width="190" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="565" y="280" text-anchor="middle" fill="#78350f" font-weight="600">Python (mereni.py)</text>
    <text x="565" y="299" text-anchor="middle" fill="#78350f">live plot, Fmax, σf</text>

    <rect x="700" y="256" width="170" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="785" y="280" text-anchor="middle" fill="#111827" font-weight="600">Outputs</text>
    <text x="785" y="299" text-anchor="middle" fill="#111827">CSV curve, PNG, summary</text>

    <rect x="700" y="344" width="170" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="785" y="366" text-anchor="middle" fill="#4c1d95" font-weight="600">Statistics</text>
    <text x="785" y="384" text-anchor="middle" fill="#4c1d95">pandas, SciPy, JASP</text>

    <g stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <path d="M400 187 C430 187 440 108 466 108"/>
      <path d="M565 136 L565 164"/>
      <path d="M565 224 L565 252"/>
      <path d="M660 284 L696 284"/>
      <path d="M785 312 L785 340"/>
    </g>
    <text x="575" y="245" font-size="11" fill="#6b7280">USB serial 115200 Bd</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <text x="30" y="404" font-size="12" fill="#6b7280">σf = 3FL / (2bh²); support and nose radius 5 mm; inspired by ISO 178, not a certified test</text>
</svg>
